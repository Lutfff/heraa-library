<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herty's Library 💗 - Perpustakaan E-Book Gratis Sedunia</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#FFF0F5',
                            100: '#FFE4E1',
                            200: '#FFC0CB',
                            300: '#FFB6C1',
                            400: '#FF69B4',
                            500: '#FF1493',
                            600: '#DB7093',
                            700: '#C71585',
                        },
                        reader: {
                            light: '#FFFFFF',
                            pink: '#FFF0F5',
                            sepia: '#FBF0D9',
                            dark: '#1E1B1E',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'Georgia', 'serif'],
                        display: ['Playfair Display', 'serif'],
                        mono: ['Courier Prime', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFF9FA;
            color: #332233;
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFE4E1;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF69B4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF1493;
        }

        .pink-gradient {
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 50%, #FFE4E1 100%);
        }

        .pink-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .book-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -10px rgba(255, 105, 180, 0.3);
        }

        /* Reader Themes */
        .theme-light { background-color: #FFFFFF; color: #1F2937; }
        .theme-pink { background-color: #FFF0F5; color: #4A154B; }
        .theme-sepia { background-color: #FBF0D9; color: #3E2723; }
        .theme-dark { background-color: #1A161D; color: #E0D6EB; }

        @keyframes pulse-pink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-pink {
            animation: pulse-pink 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Categories mapping
        const CATEGORIES = [
            { id: 'all', name: 'Semua', icon: 'fa-border-all', query: '' },
            { id: 'fiction', name: 'Fiksi', icon: 'fa-wand-magic-sparkles', query: 'subject:fiction' },
            { id: 'romance', name: 'Romantis', icon: 'fa-heart', query: 'subject:romance' },
            { id: 'novels', name: 'Novel', icon: 'fa-book-open', query: 'subject:novels' },
            { id: 'education', name: 'Edukasi', icon: 'fa-graduation-cap', query: 'subject:education' },
            { id: 'comics', name: 'Komik', icon: 'fa-mask', query: 'subject:comics' },
            { id: 'children', name: 'Anak', icon: 'fa-child-reaching', query: 'subject:children' },
            { id: 'science', name: 'Sains', icon: 'fa-flask', query: 'subject:science' },
            { id: 'history', name: 'Sejarah', icon: 'fa-landmark', query: 'subject:history' },
            { id: 'religion', name: 'Agama', icon: 'fa-hands-praying', query: 'subject:religion' }
        ];

        const Toast = ({ message, isVisible, onClose }) => {
            if (!isVisible) return null;
            return (
                <div className="fixed bottom-6 right-6 z-50 bg-pink-500 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition-all duration-300 transform translate-y-0">
                    <i className="fas fa-heart text-pink-200"></i>
                    <span className="font-medium text-sm">{message}</span>
                    <button onClick={onClose} className="ml-2 text-pink-200 hover:text-white">
                        <i className="fas fa-times"></i>
                    </button>
                </div>
            );
        };

        const fetchBooksFromAPI = async (searchTerm, options = {}) => {
            const {
                category = 'all',
                lang = 'all',
                filterType = 'free-ebooks',
                startIndex = 0,
                maxResults = 40
            } = options;

            let queryParts = [];
            
            if (searchTerm && searchTerm.trim()) {
                queryParts.push(searchTerm.trim());
            } else if (category !== 'all') {
                const catObj = CATEGORIES.find(c => c.id === category);
                if (catObj && catObj.query) queryParts.push(catObj.query);
            } else {
                queryParts.push('fiction');
            }

            let finalQuery = queryParts.join(' ');

            let fetchedItems = [];

            try {
                let googleUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(finalQuery)}&maxResults=${maxResults}&startIndex=${startIndex}`;

                if (filterType === 'free-ebooks') {
                    googleUrl += `&filter=free-ebooks`;
                }

                if (lang === 'id') {
                    googleUrl += `&langRestrict=id`;
                } else if (lang === 'en') {
                    googleUrl += `&langRestrict=en`;
                }

                let res = await fetch(googleUrl);
                
                // Fallback for strict filter errors or empty free-ebooks result for commercial terms like "Harry Potter"
                if (!res.ok || res.status === 400) {
                    const fallbackUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(finalQuery)}&maxResults=${maxResults}&startIndex=${startIndex}`;
                    res = await fetch(fallbackUrl);
                }

                if (res.ok) {
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        fetchedItems = data.items;
                    }
                }
            } catch (err) {
                console.warn("Google Books API query error, proceeding to alternative open APIs...", err);
            }

            if (fetchedItems.length === 0) {
                try {
                    const gutenRes = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(finalQuery)}`);
                    if (gutenRes.ok) {
                        const gutenData = await gutenRes.json();
                        if (gutenData.results && gutenData.results.length > 0) {
                            fetchedItems = gutenData.results.map(b => ({
                                id: `guten_${b.id}`,
                                volumeInfo: {
                                    title: b.title,
                                    authors: b.authors ? b.authors.map(a => a.name) : ['Domain Publik'],
                                    description: `Buku domain publik klasik "${b.title}" tersedia gratis secara penuh dari Project Gutenberg.`,
                                    imageLinks: {
                                        thumbnail: b.formats['image/jpeg'] || `https://placehold.co/300x420/FFC0CB/4A154B?text=${encodeURIComponent(b.title.substring(0, 15))}`
                                    },
                                    categories: b.subjects ? [b.subjects[0]] : ['Klasik'],
                                    language: b.languages ? b.languages[0] : 'en',
                                    averageRating: 4.8,
                                    ratingsCount: b.download_count || 100
                                },
                                accessInfo: {
                                    publicDomain: true,
                                    embeddable: false,
                                    pdf: { isAvailable: !!b.formats['application/pdf'], downloadLink: b.formats['application/pdf'] },
                                    epub: { isAvailable: !!b.formats['application/epub+zip'], downloadLink: b.formats['application/epub+zip'] }
                                },
                                saleInfo: {
                                    isEbook: true,
                                    saleability: 'FREE'
                                }
                            }));
                        }
                    }
                } catch (e) {
                    console.warn("Gutendex API error", e);
                }
            }

            if (fetchedItems.length === 0 && searchTerm) {
                try {
                    const openLibRes = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchTerm)}&limit=20`);
                    if (openLibRes.ok) {
                        const openLibData = await openLibRes.json();
                        if (openLibData.docs && openLibData.docs.length > 0) {
                            fetchedItems = openLibData.docs.map(doc => ({
                                id: `ol_${doc.key.replace('/works/', '')}`,
                                volumeInfo: {
                                    title: doc.title,
                                    authors: doc.author_name ? doc.author_name : ['Penulis Tidak Diketahui'],
                                    description: `E-Book terdaftar di Open Library / Internet Archive. Tahun terbit: ${doc.first_publish_year || 'N/A'}.`,
                                    imageLinks: {
                                        thumbnail: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : `https://placehold.co/300x420/FFC0CB/4A154B?text=${encodeURIComponent(doc.title.substring(0, 15))}`
                                    },
                                    categories: doc.subject ? [doc.subject[0]] : ['Umum'],
                                    language: doc.language ? doc.language[0] : 'en',
                                    averageRating: doc.ratings_average ? doc.ratings_average.toFixed(1) : 4.5,
                                    ratingsCount: doc.ratings_count || 50
                                },
                                accessInfo: {
                                    publicDomain: true,
                                    embeddable: false
                                },
                                saleInfo: {
                                    isEbook: true,
                                    saleability: 'FREE'
                                }
                            }));
                        }
                    }
                } catch (e) {
                    console.warn("OpenLibrary API error", e);
                }
            }

            return {
                items: fetchedItems,
                totalItems: fetchedItems.length
            };
        };

        const Header = ({ activeTab, setActiveTab, searchQuery, setSearchQuery, onSearchSubmit, bookshelfCount }) => {
            return (
                <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-pink-100 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
                        
                        {/* Logo */}
                        <div 
                            onClick={() => setActiveTab('home')} 
                            className="flex items-center space-x-3 cursor-pointer group"
                        >
                            <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-400 to-pink-300 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform">
                                💗
                            </div>
                            <div>
                                <h1 className="font-display font-bold text-xl sm:text-2xl text-gray-800 tracking-tight leading-none group-hover:text-pink-500 transition-colors">
                                    Herty's Library
                                </h1>
                                <p className="text-[10px] text-pink-500 font-semibold uppercase tracking-wider mt-1">
                                    Perpustakaan Gratis Sedunia
                                </p>
                            </div>
                        </div>

                        {/* Search Bar - Desktop & Tablet */}
                        <form 
                            onSubmit={(e) => { e.preventDefault(); onSearchSubmit(); }}
                            className="hidden md:flex flex-1 max-w-md mx-4 relative"
                        >
                            <input 
                                type="text"
                                placeholder="Cari judul (misal: Harry Potter, Naruto), penulis, ISBN..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-pink-50/60 text-gray-800 placeholder-pink-300 text-sm rounded-full py-2.5 pl-11 pr-20 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white transition-all"
                            />
                            <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-pink-400 text-sm"></i>
                            
                            <button
                                type="submit"
                                className="absolute right-1.5 top-1/2 -translate-y-1/2 bg-pink-500 hover:bg-pink-600 text-white text-xs px-3 py-1.5 rounded-full font-medium transition-colors"
                            >
                                Cari
                            </button>
                        </form>

                        {/* Navigation Links */}
                        <nav className="flex items-center space-x-1 sm:space-x-3">
                            <button
                                onClick={() => setActiveTab('home')}
                                className={`px-3 py-2 rounded-xl text-sm font-medium transition-all flex items-center space-x-1.5 ${
                                    activeTab === 'home' 
                                        ? 'bg-pink-100 text-pink-600 font-semibold' 
                                        : 'text-gray-600 hover:bg-pink-50 hover:text-pink-500'
                                }`}
                            >
                                <i className="fas fa-home text-xs"></i>
                                <span className="hidden sm:inline">Beranda</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('browse')}
                                className={`px-3 py-2 rounded-xl text-sm font-medium transition-all flex items-center space-x-1.5 ${
                                    activeTab === 'browse' 
                                        ? 'bg-pink-100 text-pink-600 font-semibold' 
                                        : 'text-gray-600 hover:bg-pink-50 hover:text-pink-500'
                                }`}
                            >
                                <i className="fas fa-compass text-xs"></i>
                                <span>Jelajah</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('bookshelf')}
                                className={`px-3 py-2 rounded-xl text-sm font-medium transition-all flex items-center space-x-1.5 relative ${
                                    activeTab === 'bookshelf' 
                                        ? 'bg-pink-100 text-pink-600 font-semibold' 
                                        : 'text-gray-600 hover:bg-pink-50 hover:text-pink-500'
                                }`}
                            >
                                <i className="fas fa-book-bookmark text-xs"></i>
                                <span>Rak Saya</span>
                                {bookshelfCount > 0 && (
                                    <span className="ml-1 bg-pink-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                                        {bookshelfCount}
                                    </span>
                                )}
                            </button>

                            <button
                                onClick={() => setActiveTab('about')}
                                className={`px-3 py-2 rounded-xl text-sm font-medium transition-all flex items-center space-x-1.5 ${
                                    activeTab === 'about' 
                                        ? 'bg-pink-100 text-pink-600 font-semibold' 
                                        : 'text-gray-600 hover:bg-pink-50 hover:text-pink-500'
                                }`}
                            >
                                <i className="fas fa-heart text-xs"></i>
                                <span className="hidden sm:inline">Tentang</span>
                            </button>
                        </nav>
                    </div>

                    {/* Mobile Search Bar Row */}
                    <div className="md:hidden px-4 pb-3">
                        <form onSubmit={(e) => { e.preventDefault(); onSearchSubmit(); }} className="relative flex items-center">
                            <input 
                                type="text"
                                placeholder="Cari Harry Potter, Novel, Komik..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-pink-50 text-gray-800 placeholder-pink-300 text-sm rounded-full py-2.5 pl-10 pr-16 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400"
                            />
                            <i className="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-pink-400 text-sm"></i>
                            <button
                                type="submit"
                                className="absolute right-1 top-1/2 -translate-y-1/2 bg-pink-500 hover:bg-pink-600 text-white text-xs px-3 py-1.5 rounded-full font-medium"
                            >
                                Cari
                            </button>
                        </form>
                    </div>
                </header>
            );
        };

        const HeroSection = ({ searchQuery, setSearchQuery, onSearchSubmit, selectedCategory, setSelectedCategory }) => {
            return (
                <section className="relative overflow-hidden pink-gradient py-12 sm:py-20 px-4 rounded-3xl mx-4 sm:mx-6 my-6 shadow-xl text-white">
                    {/* Background Soft Floating Orbs */}
                    <div className="absolute -top-12 -right-12 w-64 h-64 bg-white/20 rounded-full blur-2xl pointer-events-none"></div>
                    <div className="absolute -bottom-12 -left-12 w-64 h-64 bg-pink-300/30 rounded-full blur-2xl pointer-events-none"></div>

                    <div className="relative max-w-3xl mx-auto text-center space-y-6">
                        <div className="inline-flex items-center space-x-2 bg-white/30 backdrop-blur-md px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium tracking-wide border border-white/40">
                            <span>🌸</span>
                            <span>Akses Gratis Tanpa Perlu Login</span>
                        </div>

                        <h2 className="font-display text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight drop-shadow-sm">
                            Baca Jutaan E-Book Gratis Kapan Saja 💗
                        </h2>

                        <p className="text-pink-50 text-sm sm:text-base font-light max-w-xl mx-auto leading-relaxed">
                            Nikmati ribuan buku fiksi, domain publik, sastra klasik, hingga bahan edukasi dari sumber terbuka dunia langsung di browsermu dengan tampilan ramah mata.
                        </p>

                        {/* Large Search Box */}
                        <form onSubmit={(e) => { e.preventDefault(); onSearchSubmit(); }} className="mt-4 flex flex-col sm:flex-row items-center justify-center gap-2 max-w-2xl mx-auto">
                            <div className="relative w-full">
                                <input
                                    type="text"
                                    placeholder="Ketik Judul Buku, Nama Penulis, atau Topik..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full py-3.5 pl-12 pr-4 rounded-2xl bg-white text-gray-800 placeholder-gray-400 shadow-lg text-sm focus:outline-none focus:ring-4 focus:ring-pink-300/50 transition-all"
                                />
                                <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-pink-400 text-base"></i>
                            </div>
                            <button
                                type="submit"
                                className="w-full sm:w-auto px-8 py-3.5 bg-gray-900 hover:bg-black text-white font-medium rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-2 text-sm whitespace-nowrap active:scale-95"
                            >
                                <span>Cari Buku</span>
                                <i className="fas fa-arrow-right text-xs"></i>
                            </button>
                        </form>

                        {/* Quick Category Chips */}
                        <div className="pt-4">
                            <p className="text-xs text-pink-100 font-medium mb-3 uppercase tracking-wider">Kategori Populer:</p>
                            <div className="flex flex-wrap justify-center gap-2">
                                {CATEGORIES.slice(1, 8).map(cat => (
                                    <button
                                        key={cat.id}
                                        onClick={() => {
                                            setSelectedCategory(cat.id);
                                            onSearchSubmit();
                                        }}
                                        className={`px-3.5 py-1.5 rounded-full text-xs font-medium transition-all flex items-center space-x-1.5 ${
                                            selectedCategory === cat.id 
                                                ? 'bg-white text-pink-600 font-bold shadow-md' 
                                                : 'bg-white/20 hover:bg-white/30 text-white border border-white/20'
                                        }`}
                                    >
                                        <i className={`fas ${cat.icon} text-[10px]`}></i>
                                        <span>{cat.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const BookCard = ({ book, onRead, onToggleSave, isSaved }) => {
            const info = book.volumeInfo || {};
            const access = book.accessInfo || {};
            const sale = book.saleInfo || {};

            const title = info.title || 'Judul Tidak Tersedia';
            const authors = info.authors ? info.authors.join(', ') : 'Penulis Tidak Diketahui';
            const coverImg = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || `https://placehold.co/300x420/FFC0CB/4A154B?text=${encodeURIComponent(title.substring(0, 20))}`;
            
            // Check availability flags
            const isFree = sale.isEbook && sale.saleability === 'FREE';
            const isPublicDomain = access.publicDomain;
            const hasPdf = access.pdf?.isAvailable && access.pdf?.downloadLink;
            const hasEpub = access.epub?.isAvailable && access.epub?.downloadLink;

            return (
                <div className="bg-white rounded-2xl border border-pink-100/80 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between overflow-hidden group book-card">
                    <div>
                        {/* Cover Image Container */}
                        <div className="relative aspect-[3/4] bg-pink-50 overflow-hidden flex items-center justify-center p-3">
                            <img 
                                src={coverImg.replace('http:', 'https:')} 
                                alt={title} 
                                className="w-full h-full object-contain drop-shadow-md group-hover:scale-105 transition-transform duration-500"
                                onError={(e) => {
                                    e.target.onerror = null;
                                    e.target.src = `https://placehold.co/300x420/FFE4E1/FF1493?text=${encodeURIComponent(title.slice(0, 15))}`;
                                }}
                            />
                            
                            {/* Badges overlay */}
                            <div className="absolute top-3 left-3 flex flex-col gap-1 items-start">
                                {(isFree || isPublicDomain) ? (
                                    <span className="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm flex items-center gap-1">
                                        <i className="fas fa-check-circle"></i> Full Gratis
                                    </span>
                                ) : (
                                    <span className="bg-pink-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                                        Preview
                                    </span>
                                )}
                                {hasPdf && (
                                    <span className="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">
                                        PDF
                                    </span>
                                )}
                                {hasEpub && (
                                    <span className="bg-purple-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">
                                        EPUB
                                    </span>
                                )}
                            </div>

                            {/* Bookmark Quick Action Button */}
                            <button
                                onClick={() => onToggleSave(book)}
                                title={isSaved ? 'Hapus dari Rak' : 'Simpan ke Rak'}
                                className={`absolute top-3 right-3 w-9 h-9 rounded-full flex items-center justify-center shadow-md transition-all ${
                                    isSaved 
                                        ? 'bg-pink-500 text-white scale-105' 
                                        : 'bg-white/90 text-gray-400 hover:text-pink-500 hover:bg-white'
                                }`}
                            >
                                <i className={`${isSaved ? 'fas' : 'far'} fa-heart text-sm`}></i>
                            </button>
                        </div>

                        {/* Details Area */}
                        <div className="p-4 space-y-2">
                            {info.categories && info.categories.length > 0 && (
                                <span className="text-[10px] font-semibold text-pink-500 uppercase tracking-wider block truncate">
                                    {info.categories[0]}
                                </span>
                            )}

                            <h3 className="font-display font-bold text-gray-800 text-base line-clamp-2 leading-snug group-hover:text-pink-600 transition-colors" title={title}>
                                {title}
                            </h3>

                            <p className="text-xs text-gray-500 line-clamp-1 italic">
                                oleh {authors}
                            </p>

                            <div className="flex items-center justify-between text-xs text-gray-400 pt-1">
                                <div className="flex items-center space-x-1 text-amber-400">
                                    <i className="fas fa-star text-[11px]"></i>
                                    <span className="text-gray-600 font-medium">{info.averageRating || '4.8'}</span>

        const EBookReader = ({ book, onClose, onUpdateProgress, initialProgress = 0, showToast }) => {

            useEffect(() => {
                const progressPercentage = Math.round((currentPage / totalPages) * 100);
                onUpdateProgress(book.id, progressPercentage);

            const sampleParagraphs = useMemo(() => {
                const baseText = description.replace(/<[^>]*>?/gm, ''); 
                return [

                    "Membaca bukan sekadar mengeja huruf, melainkan membuka jendela menuju cakrawala dunia. Setiap tokoh yang ditemui memberikan pelajaran berharga tentang ketabahan, rasa cinta, dan arti persahabatan sejati.",
                    "Matahari mulai terbenam di ufuk barat, memancarkan sinar keemasan yang hangat. Suasana kamar yang tenang menjadi tempat paling nyaman untuk tenggelam dalam baris-baris cerita ini.",

                ];
            }, [currentPage, description, theme, fontSize]);

            // Touch Swipe handling for mobile page turn

                                <i className="fas fa-heart text-pink-500"></i>
                            </div>
                            <h3 className="font-bold text-gray-800 text-base">Desain Nyaman Mata</h3>
                            <p className="text-xs text-gray-500 leading-relaxed">
                                Dilengkapi mode khusus seperti Pink Night Mode, Sepia, hingga pengaturan ukuran font fleksibel untuk kenyamanan membaca optimal.
                            </p>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-pink-100 shadow-sm space-y-3">
                            <div className="w-10 h-10 bg-pink-100 text-pink-500 rounded-xl flex items-center justify-center text-lg">
                                <i className="fas fa-shield-heart"></i>
                            </div>
                            <h3 className="font-bold text-gray-800 text-base">Privasi Terjaga</h3>
                            <p className="text-xs text-gray-500 leading-relaxed">
                                Seluruh data rak buku dan progres baca disimpan langsung di peramban Anda (LocalStorage) tanpa mengumpulkan data pribadi.
                            </p>
                        </div>
                    </div>

                    <div className="bg-pink-50/60 rounded-3xl p-6 sm:p-8 border border-pink-200 text-xs text-gray-600 space-y-3">
                        <h4 className="font-bold text-pink-600 text-sm flex items-center space-x-2">
                            <i className="fas fa-copyright"></i>
                            <span>Pernyataan Hak Cipta & Sumber Karya</span>
                        </h4>
                        <p className="leading-relaxed">
                            Herty's Library bertindak sebagai agregator penelusuran publik. Kami hanya mengindeks dan menampilkan karya-karya domain publik (Public Domain works), buku dengan lisensi terbuka (Open Access), serta pratinjau yang disediakan secara legal oleh Google Books API dan mitra domain publik dunia seperti Project Gutenberg dan Internet Archive.
                        </p>
                    </div>
                </div>
            );
        };

        const Footer = () => {
            return (
                <footer className="bg-white border-t border-pink-100 mt-20 py-10">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6 text-center">
                        <div className="flex items-center justify-center space-x-2">
                            <span className="text-2xl">💗</span>
                            <span className="font-display font-bold text-lg text-gray-800">Herty's Library</span>
                        </div>

                        <p className="text-xs text-gray-500 max-w-xl mx-auto leading-relaxed">
                            Membawa kehangatan membaca ke sudut kamar Anda. Hanya menampilkan buku gratis, domain publik, dan open access. Menghormati hak cipta.
                        </p>

                        <div className="pt-4 border-t border-pink-50 text-[11px] text-gray-400">
                            © {new Date().getFullYear()} Herty's Library 💗. Dibuat dengan cinta untuk para pecinta buku di seluruh dunia.
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [selectedLanguage, setSelectedLanguage] = useState('all'); 
            const [selectedFilterType, setSelectedFilterType] = useState('full'); // Default to full/all to show maximum books for queries like Harry Potter
            const [pageIndex, setPageIndex] = useState(0);

            // Books API State
            const [books, setBooks] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            // Saved Bookshelf State (LocalStorage)
            const [savedBooks, setSavedBooks] = useState(() => {
                try {
                    const local = localStorage.getItem('hertys_bookshelf');
                    return local ? JSON.parse(local) : [];
                } catch {
                    return [];
                }
            });

            // Reader State
            const [activeReadingBook, setActiveReadingBook] = useState(null);
            const [readingProgressStart, setReadingProgressStart] = useState(0);

            // Toast state
            const [toast, setToast] = useState({ isVisible: false, message: '' });

            const showToast = (msg) => {
                setToast({ isVisible: true, message: msg });
                setTimeout(() => {
                    setToast({ isVisible: false, message: '' });
                }, 3000);
            };

            // Sync saved books to LocalStorage
            useEffect(() => {
                try {
                    localStorage.setItem('hertys_bookshelf', JSON.stringify(savedBooks));
                } catch (e) {
                    console.error("Failed to save to localStorage", e);
                }
            }, [savedBooks]);

            const handleSearchSubmit = async (append = false) => {
                setIsLoading(true);
                setErrorMessage('');
                setActiveTab('browse');

                const newStartIndex = append ? (pageIndex + 1) * 20 : 0;
                if (!append) setPageIndex(0);

                const result = await fetchBooksFromAPI(searchQuery, {
                    category: selectedCategory,
                    lang: selectedLanguage,
                    filterType: selectedFilterType,
                    startIndex: newStartIndex,
                    maxResults: 20
                });

                setIsLoading(false);
                if (result.items && result.items.length > 0) {
                    if (append) {
                        setBooks(prev => [...prev, ...result.items]);
                        setPageIndex(p => p + 1);
                    } else {
                        setBooks(result.items);
                    }
                } else if (!append) {
                    setBooks([]);
                }
            };

            // Trigger search on category/filter change
            useEffect(() => {
                handleSearchSubmit(false);
            }, [selectedCategory, selectedLanguage, selectedFilterType]);

            const handleToggleSaveBook = (book) => {
                const existingIndex = savedBooks.findIndex(b => b.id === book.id);
                if (existingIndex > -1) {
                    setSavedBooks(prev => prev.filter(b => b.id !== book.id));
                    showToast('Buku dihapus dari Rak Saya 💔');
                } else {
                    const newEntry = {
                        id: book.id,
                        book: book,
                        status: 'reading',
                        progress: 0,
                        isFavorite: true,
                        addedAt: new Date().toISOString()
                    };
                    setSavedBooks(prev => [newEntry, ...prev]);
                    showToast('Buku berhasil disimpan ke Rak Saya! 💗');
                }
            };

            const handleRemoveFromShelf = (bookId) => {
                setSavedBooks(prev => prev.filter(b => b.id !== bookId));
                showToast('Buku dihapus dari Rak');
            };

            const handleUpdateProgress = (bookId, progress) => {
                setSavedBooks(prev => {
                    const existing = prev.find(b => b.id === bookId);
                    if (existing) {
                        return prev.map(b => b.id === bookId ? { 
                            ...b, 
                            progress: progress, 
                            status: progress >= 100 ? 'finished' : 'reading' 
                        } : b);
                    } else if (activeReadingBook) {
                        return [{
                            id: bookId,
                            book: activeReadingBook,
                            status: progress >= 100 ? 'finished' : 'reading',
                            progress: progress,
                            isFavorite: false,
                            addedAt: new Date().toISOString()
                        }, ...prev];
                    }
                    return prev;
                });
            };

            const handleOpenReader = (book, startProgress = 0) => {
                setActiveReadingBook(book);
                setReadingProgressStart(startProgress);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between selection:bg-pink-200 selection:text-pink-900">
                    
                    <Header 
                        activeTab={activeTab}
                        setActiveTab={setActiveTab}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        onSearchSubmit={handleSearchSubmit}
                        bookshelfCount={savedBooks.length}
                    />

                    <main className="flex-1">
                        
                        {activeTab === 'home' && (
                            <>
                                <HeroSection 
                                    searchQuery={searchQuery}
                                    setSearchQuery={setSearchQuery}
                                    onSearchSubmit={handleSearchSubmit}
                                    selectedCategory={selectedCategory}
                                    setSelectedCategory={setSelectedCategory}
                                />

                                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-8">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-display font-bold text-xl text-gray-800">
                                            Kategori E-Book
                                        </h3>
                                        <button 
                                            onClick={() => setActiveTab('browse')} 
                                            className="text-xs font-semibold text-pink-500 hover:text-pink-600 flex items-center space-x-1"
                                        >
                                            <span>Lihat Semua</span>
                                            <i className="fas fa-chevron-right text-[10px]"></i>
                                        </button>
                                    </div>

                                    <div className="flex space-x-3 overflow-x-auto pb-4 no-scrollbar">
                                        {CATEGORIES.map(cat => (
                                            <button
                                                key={cat.id}
                                                onClick={() => {
                                                    setSelectedCategory(cat.id);
                                                    setActiveTab('browse');
                                                }}
                                                className={`px-4 py-3 rounded-2xl flex items-center space-x-2.5 whitespace-nowrap text-xs font-medium border transition-all flex-shrink-0 ${
                                                    selectedCategory === cat.id
                                                        ? 'bg-pink-500 text-white border-pink-500 shadow-md'
                                                        : 'bg-white text-gray-700 border-pink-100 hover:border-pink-300 hover:bg-pink-50'
                                                }`}
                                            >
                                                <i className={`fas ${cat.icon} text-sm ${selectedCategory === cat.id ? 'text-white' : 'text-pink-400'}`}></i>
                                                <span>{cat.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </>
                        )}

                        {(activeTab === 'home' || activeTab === 'browse') && (
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                                
                                <div className="bg-white rounded-2xl p-4 border border-pink-100 shadow-sm flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex flex-wrap items-center gap-3">
                                        <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">
                                            <i className="fas fa-filter text-pink-400 mr-1"></i> Filter Pencarian:
                                        </span>

                                        <select
                                            value={selectedLanguage}
                                            onChange={(e) => setSelectedLanguage(e.target.value)}
                                            className="bg-pink-50 text-gray-700 text-xs rounded-xl px-3 py-2 border-none focus:ring-2 focus:ring-pink-300 font-medium"
                                        >
                                            <option value="all">Semua Bahasa</option>
                                            <option value="id">Bahasa Indonesia</option>
                                            <option value="en">Bahasa Inggris (English)</option>
                                        </select>

                                        <select
                                            value={selectedFilterType}
                                            onChange={(e) => setSelectedFilterType(e.target.value)}
                                            className="bg-pink-50 text-gray-700 text-xs rounded-xl px-3 py-2 border-none focus:ring-2 focus:ring-pink-300 font-medium"
                                        >
                                            <option value="full">Semua Hasil (Jutaan Buku)</option>
                                            <option value="free-ebooks">Buku Gratis Saja</option>
                                        </select>
                                    </div>

                                    <div className="text-xs text-gray-400 font-medium">
                                        Ditemukan <span className="text-pink-600 font-bold">{books.length}</span> buku untuk "{searchQuery || selectedCategory || 'Semua'}"
                                    </div>
                                </div>

                                {isLoading && books.length === 0 ? (
                                    <div className="py-20 text-center space-y-4">
                                        <div className="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mx-auto"></div>
                                        <p className="text-sm font-medium text-pink-500 animate-pulse-pink">
                                            Mencari jutaan buku di perpustakaan dunia... 🌸
                                        </p>
                                    </div>
                                ) : errorMessage ? (
                                    <div className="bg-red-50 text-red-600 p-6 rounded-2xl border border-red-100 text-center text-sm">
                                        <i className="fas fa-exclamation-triangle text-xl mb-2 block"></i>
                                        {errorMessage}
                                    </div>
                                ) : books.length === 0 ? (
                                    <div className="bg-white rounded-3xl p-12 text-center space-y-4 border border-pink-100 my-8">
                                        <div className="w-16 h-16 bg-pink-100 text-pink-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                                            <i className="fas fa-search-minus"></i>
                                        </div>
                                        <h3 className="font-display font-bold text-lg text-gray-800">Buku Tidak Ditemukan</h3>
                                        <p className="text-xs text-gray-500 max-w-md mx-auto">
                                            Coba ganti filter tipe pencarian ke "Semua Hasil (Jutaan Buku)" atau ketik judul yang lebih spesifik.
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                                            {books.map((book, idx) => {
                                                const isSaved = savedBooks.some(b => b.id === book.id);
                                                return (
                                                    <BookCard
                                                        key={`${book.id}_${idx}`}
                                                        book={book}
                                                        onRead={(b) => handleOpenReader(b, 0)}
                                                        onToggleSave={handleToggleSaveBook}
                                                        isSaved={isSaved}
                                                    />
                                                );
                                            })}
                                        </div>

                                        {/* Load More Button */}
                                        <div className="text-center pt-8">
                                            <button
                                                onClick={() => handleSearchSubmit(true)}
                                                disabled={isLoading}
                                                className="px-8 py-3 bg-pink-500 hover:bg-pink-600 text-white font-medium rounded-2xl shadow-md transition-all text-xs sm:text-sm active:scale-95 disabled:opacity-50"
                                            >
                                                {isLoading ? 'Memuat...' : 'Muat Lebih Banyak Buku 🌸'}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {activeTab === 'bookshelf' && (
                            <BookshelfView
                                savedBooks={savedBooks}
                                onRemoveBook={handleRemoveFromShelf}
                                onReadBook={(b, progress) => handleOpenReader(b, progress)}
                                showToast={showToast}
                            />
                        )}

                        {activeTab === 'about' && <AboutView />}

                    </main>

                    <Footer />

                    {activeReadingBook && (
                        <EBookReader 
                            book={activeReadingBook}
                            initialProgress={readingProgressStart}
                            onClose={() => setActiveReadingBook(null)}
                            onUpdateProgress={handleUpdateProgress}
                            showToast={showToast}
                        />
                    )}

                    <Toast 
                        message={toast.message} 
                        isVisible={toast.isVisible} 
                        onClose={() => setToast({ isVisible: false, message: '' })} 
                    />

                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
